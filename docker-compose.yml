services:
  postgres-db:
    image: postgres:16-alpine
    container_name: project_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: luis
      POSTGRES_PASSWORD: luis123
      POSTGRES_DB: project_management_db
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
